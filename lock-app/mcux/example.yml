  section-type: custom_application
  contents:
    document:
      brief: Thread Minimal Thread Device (MTD) configuration
      extra_build_args:
      - -DCONF_FILE=middleware/matter/examples/platform/nxp/config/prj_thread_mtd.conf
      - -DCONFIG_MCUX_COMPONENT_middleware.freertos-kernel.config=n
  boards:
    frdmmcxw72@cm33_core0: []
    mcxw72evk@cm33_core0: []

