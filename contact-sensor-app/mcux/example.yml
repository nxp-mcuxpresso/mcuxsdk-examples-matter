# This file describes the Matter Contact-Sensor-App example application for the NXP MCUXpresso SDK.

contact-sensor-app:
  section-type: application
  contents:
    project-root-path: examples/matter_examples/contact-sensor-app/mcux
    meta_path: examples/matter_examples/contact-sensor-app/mcux
    document:
      name: contact-sensor-app
      category: matter_examples
      brief: The NXP contact-sensor-app example is based on Project CHIP and NXP SDK,
        and provides a prototype of a contact-sensor device which demonstrates device 
        commissioning and different cluster control.
      example_readme:
      - examples/matter_examples/contact-sensor-app/README.md
      extra_build_args:
      - -DCONFIG_MCUX_COMPONENT_middleware.freertos-kernel.config=n
    extra_files:
    - source: ${SdkRootDirPath}/middleware/matter/examples/contact-sensor-app/nxp/zap-lit
      destination: zap-lit
    - source: ${SdkRootDirPath}/middleware/matter/examples/contact-sensor-app/nxp/zap-sit
      destination: zap-sit
    - source: ${SdkRootDirPath}/middleware/matter/examples/contact-sensor-app/nxp/common
      destination: common
    - source: ${SdkRootDirPath}/middleware/matter/third_party/nxp/nxp_matter_support/examples/platform/mcxw71/nxp_sdk_reconfig.cmake
      destination: nxp_sdk_reconfig.cmake
      board: [frdmmcxw71, frdmmcxw72]
    - source: ${SdkRootDirPath}/examples/_boards/${board}/wireless_examples/linker/gcc/connectivity.ld
      destination: ldscripts/connectivity.ld
      board: [frdmmcxw71, frdmmcxw72]
    replacements:
    - file: CMakeLists.txt
      replace:
        - from: "get_filename_component(NXP_EXAMPLE_DIR ${CMAKE_CURRENT_SOURCE_DIR}/../common REALPATH)"
          to: "get_filename_component(NXP_EXAMPLE_DIR ${CMAKE_CURRENT_SOURCE_DIR}/common REALPATH)"
    - file: CMakeLists.txt
      replace:
        - from: "get_filename_component(NXP_EXAMPLE_ZAP_LIT_DIR ${CMAKE_CURRENT_SOURCE_DIR}/../zap-lit REALPATH)"
          to: "get_filename_component(NXP_EXAMPLE_ZAP_LIT_DIR ${CMAKE_CURRENT_SOURCE_DIR}/zap-lit REALPATH)"
    - file: CMakeLists.txt
      replace:
        - from: "get_filename_component(NXP_EXAMPLE_ZAP_SIT_DIR ${CMAKE_CURRENT_SOURCE_DIR}/../zap-sit REALPATH)"
          to: "get_filename_component(NXP_EXAMPLE_ZAP_SIT_DIR ${CMAKE_CURRENT_SOURCE_DIR}/zap-sit REALPATH)"
    - file: CMakeLists.txt
      replace:
        - from: "get_filename_component(NXP_SDK_RECONFIG_CMAKE_DIR ${NXP_MATTER_SUPPORT_DIR}/examples/platform/${CONFIG_CHIP_NXP_PLATFORM_FAMILY} REALPATH)"
          to: "get_filename_component(NXP_SDK_RECONFIG_CMAKE_DIR ${CMAKE_CURRENT_SOURCE_DIR} REALPATH)"
    - file: nxp_sdk_reconfig.cmake
      replace:
        - from: "BASE_PATH ${MATTER_DEFAULT_LINKER_FILE_PATH}"
          to: "BASE_PATH ${CMAKE_CURRENT_SOURCE_DIR}"
    - file: nxp_sdk_reconfig.cmake
      replace:
        - from: "LINKER ${MATTER_DEFAULT_LINKER_FILE_NAME}"
          to: "LINKER ldscripts/connectivity.ld"
      board: [frdmmcxw71, frdmmcxw72]
    toolchains:
    - +armgcc@debug
    - +armgcc@release
    - -armgcc@flash_debug
    - -armgcc@flash_release
    - -armgcc@flexspi_nor_debug
    - -armgcc@flexspi_nor_release
    - -armgcc@sdram_debug
    - -armgcc@sdram_release
    - -iar@debug
    - -iar@release
    - -iar@flash_debug
    - -iar@flash_release
    - -iar@flexspi_nor_debug
    - -iar@flexspi_nor_release
    - -iar@sdram_debug
    - -iar@sdram_release
    - -mdk@debug
    - -mdk@release
    - -mdk@flash_debug
    - -mdk@flash_release
    - -mdk@flexspi_nor_debug
    - -mdk@flexspi_nor_release
    - -mdk@sdram_debug
    - -mdk@sdram_release
  boards:
    frdmmcxw71: []
    frdmmcxw72@cm33_core0: []

