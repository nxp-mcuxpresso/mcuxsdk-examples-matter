# This file describes the Matter Lock-App example application for the NXP MCUXpresso SDK.

lock_app_aliro:
  section-type: application
  contents:
    project-root-path: examples/matter_examples/lock-app-aliro/mcux
    meta_path: examples/matter_examples/lock-app-aliro/mcux
    document:
      name: lock-app-aliro
      category: matter_examples
      brief: The NXP lock-app example with ALIRO support is based on Project CHIP and NXP SDK,
        and provides a prototype of a smart lock device that supports ALIRO access flow using NFC or Bluetooth LE + UBW
      example_readme:
      - examples/matter_examples/lock-app-aliro/README.md
      extra_build_args:
      - -DCONFIG_MCUX_COMPONENT_middleware.freertos-kernel.config=n
    extra_files:
    - source: examples/matter_examples/lock-app-aliro/README.md
      destination: README.md
    - source: ${SdkRootDirPath}/middleware/matter/examples/lock-app/nxp/zap
      destination: zap
    - source: ${SdkRootDirPath}/middleware/matter/examples/lock-app/nxp/common
      destination: common
    - source: examples/matter_examples/lock-app-aliro/source
      destination: source
    - source: examples/matter_examples/lock-app-aliro/include
      destination: include
    - source: ${SdkRootDirPath}/middleware/matter/third_party/nxp/nxp_matter_support/examples/platform/mcxw72/nxp_sdk_reconfig.cmake
      destination: nxp_sdk_reconfig.cmake
      board: [frdmmcxw72]
    - source: ${SdkRootDirPath}/examples/_boards/${board}/wireless_examples/linker/gcc/connectivity.ld
      destination: ldscripts/connectivity.ld
      board: [frdmmcxw72]
    replacements:
    - file: CMakeLists.txt
      replace:
        - from: "get_filename_component(NXP_EXAMPLE_DIR ${CMAKE_CURRENT_SOURCE_DIR}/../common REALPATH)"
          to: "get_filename_component(NXP_EXAMPLE_DIR ${CMAKE_CURRENT_SOURCE_DIR}/common REALPATH)"
    - file: CMakeLists.txt
      replace:
        - from: "get_filename_component(NXP_EXAMPLE_ZAP_DIR ${CMAKE_CURRENT_SOURCE_DIR}/../zap REALPATH)"
          to: "get_filename_component(NXP_EXAMPLE_ZAP_DIR ${CMAKE_CURRENT_SOURCE_DIR}/zap REALPATH)"
    - file: CMakeLists.txt
      replace:
        - from: "get_filename_component(NXP_SDK_RECONFIG_CMAKE_DIR ${NXP_MATTER_SUPPORT_DIR}/examples/platform/${CONFIG_CHIP_NXP_PLATFORM_FAMILY} REALPATH)"
          to: "get_filename_component(NXP_SDK_RECONFIG_CMAKE_DIR ${CMAKE_CURRENT_SOURCE_DIR} REALPATH)"
    - file: nxp_sdk_reconfig.cmake
      replace:
        - from: "BASE_PATH ${MATTER_DEFAULT_LINKER_FILE_PATH}"
          to: "BASE_PATH ${CMAKE_CURRENT_SOURCE_DIR}"
    - file: nxp_sdk_reconfig.cmake
      replace:
        - from: "LINKER ${MATTER_DEFAULT_LINKER_FILE_NAME}"
          to: "LINKER ldscripts/connectivity.ld"
      board: [frdmmcxw72]
    freestanding_copied_folders:
    -  middleware/matter/third_party/nxp/nxp_matter_support/examples/platform/project_segments
    toolchains:
    - +armgcc@debug
    - +armgcc@release
    - -armgcc@flash_debug
    - -armgcc@flash_release
    - -armgcc@flexspi_nor_debug
    - -armgcc@flexspi_nor_release
    - -armgcc@sdram_debug
    - -armgcc@sdram_release
    - -iar@debug
    - -iar@release
    - -iar@flash_debug
    - -iar@flash_release
    - -iar@flexspi_nor_debug
    - -iar@flexspi_nor_release
    - -iar@sdram_debug
    - -iar@sdram_release
    - -mdk@debug
    - -mdk@release
    - -mdk@flash_debug
    - -mdk@flash_release
    - -mdk@flexspi_nor_debug
    - -mdk@flexspi_nor_release
    - -mdk@sdram_debug
    - -mdk@sdram_release
  boards:
    frdmmcxw72@cm33_core0: []

# --- Thread MTD Configuration ---
lock_app_aliro@thread_mtd:
  section-type: custom_application
  contents:
    document:
      brief: Thread Minimal Thread Device (MTD) configuration
      extra_build_args:
      - -DCONFIG_MCUX_COMPONENT_middleware.freertos-kernel.config=n
  boards:
    frdmmcxw72@cm33_core0: []

# --- Thread MTD OTA Configuration ---
lock_app_aliro@thread_mtd_ota:
  section-type: custom_application
  contents:
    document:
      brief: Thread MTD configuration with OTA update capability
      extra_build_args:
      - -DCONFIG_CHIP_OTA_REQUESTOR=y
      - -DCONFIG_CHIP_OTA_IMAGE_BUILD=n
      - -DCONFIG_MCUX_COMPONENT_middleware.freertos-kernel.config=n
  boards:
    frdmmcxw72@cm33_core0: []
