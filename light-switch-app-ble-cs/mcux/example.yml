# This file describes the Matter Light Switch App BLE CS example application for the NXP MCUXpresso SDK.

light-switch-app-ble-cs:
  section-type: application
  contents:
    project-root-path: examples/matter_examples/light-switch-app-ble-cs/mcux
    meta_path: examples/matter_examples/light-switch-app-ble-cs/mcux
    document:
      name: light-switch-app-ble-cs
      category: matter_examples
      brief: The NXP Light Switch App BLE CS example is based on Project CHIP and NXP SDK,
        and provides a prototype of a Light Switch App + BLE CS functionality.
      example_readme:
      - examples/matter_examples/light-switch-app-ble-cs/README.md
      extra_build_args:
        - -DCONFIG_MCUX_COMPONENT_middleware.freertos-kernel.config=n
    extra_files:
    - source: ${SdkRootDirPath}/middleware/matter/examples/light-switch-app/nxp/zap
      destination: zap
    - source: ${SdkRootDirPath}/middleware/matter/examples/light-switch-app/nxp/common
      destination: common
    - source: ${SdkRootDirPath}/middleware/matter/third_party/nxp/nxp_matter_support/examples/platform/mcxw71/nxp_sdk_reconfig.cmake
      destination: nxp_sdk_reconfig.cmake
    - source: examples/matter_examples/light-switch-app-ble-cs/main/source
      destination: common
      board: [frdmmcxw72, mcxw72evk]
    - source: ${SdkRootDirPath}/examples/_boards/${board}/wireless_examples/linker/gcc/connectivity.ld
      destination: ldscripts/connectivity.ld
      board: [frdmmcxw72, mcxw72evk]
    replacements:
    - file: CMakeLists.txt
      replace:
        - from: "get_filename_component(NXP_EXAMPLE_DIR ${CMAKE_CURRENT_SOURCE_DIR}/../common REALPATH)"
          to: "get_filename_component(NXP_EXAMPLE_DIR ${CMAKE_CURRENT_SOURCE_DIR}/common REALPATH)"
    - file: CMakeLists.txt
      replace:
        - from: "get_filename_component(NXP_EXAMPLE_ZAP_DIR ${CMAKE_CURRENT_SOURCE_DIR}/../zap REALPATH)"
          to: "get_filename_component(NXP_EXAMPLE_ZAP_DIR ${CMAKE_CURRENT_SOURCE_DIR}/zap REALPATH)"
    - file: CMakeLists.txt
      replace:
        - from: "get_filename_component(NXP_SDK_RECONFIG_CMAKE_DIR ${NXP_MATTER_SUPPORT_DIR}/examples/platform/${CONFIG_CHIP_NXP_PLATFORM_FAMILY} REALPATH)"
          to: "get_filename_component(NXP_SDK_RECONFIG_CMAKE_DIR ${CMAKE_CURRENT_SOURCE_DIR} REALPATH)"
    - file: CMakeLists.txt
      replace:
        - from: "${CMAKE_CURRENT_SOURCE_DIR}/../main/source"
          to: "${CMAKE_CURRENT_SOURCE_DIR}/common"
    - file: nxp_sdk_reconfig.cmake
      replace:
        - from: "BASE_PATH ${MATTER_DEFAULT_LINKER_FILE_PATH}"
          to: "BASE_PATH ${CMAKE_CURRENT_SOURCE_DIR}"
    - file: nxp_sdk_reconfig.cmake
      replace:
        - from: "LINKER ${MATTER_DEFAULT_LINKER_FILE_NAME}"
          to: "LINKER ldscripts/connectivity.ld"
      board: [frdmmcxw72, mcxw72evk]
    freestanding_copied_folders:
    -  middleware/matter/third_party/nxp/nxp_matter_support/examples/platform/project_segments
    toolchains:
    - +armgcc@debug
    - +armgcc@release
    - -armgcc@flash_debug
    - -armgcc@flash_release
    - -armgcc@flexspi_nor_debug
    - -armgcc@flexspi_nor_release
    - -armgcc@sdram_debug
    - -armgcc@sdram_release
    - -iar@debug
    - -iar@release
    - -iar@flash_debug
    - -iar@flash_release
    - -iar@flexspi_nor_debug
    - -iar@flexspi_nor_release
    - -iar@sdram_debug
    - -iar@sdram_release
    - -mdk@debug
    - -mdk@release
    - -mdk@flash_debug
    - -mdk@flash_release
    - -mdk@flexspi_nor_debug
    - -mdk@flexspi_nor_release
    - -mdk@sdram_debug
    - -mdk@sdram_release
  boards:
    frdmmcxw72@cm33_core0: []
    mcxw72evk@cm33_core0: []
light-switch-app-ble-cs@thread_ftd:
  section-type: custom_application
  contents:
    document:
      extra_build_args:
      - -DCONF_FILE=middleware/matter/examples/platform/nxp/config/prj_thread_ftd.conf
      - -DCONFIG_MCUX_COMPONENT_middleware.freertos-kernel.config=n
  boards:
