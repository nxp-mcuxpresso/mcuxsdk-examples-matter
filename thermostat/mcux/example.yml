      brief: Wi-Fi configuration with IW610 transceiver
      extra_build_args:
        - -DCONF_FILE=middleware/matter/examples/platform/nxp/config/prj_wifi.conf
        - -DCONFIG_MCUX_COMPONENT_component.wifi_bt_module.IW61X=y
