# This file describes the Matter Thermostat example application for the NXP MCUXpresso SDK.

thermostat:
  section-type: application
  contents:
    project-root-path: examples/matter_examples/thermostat/mcux
    meta_path: examples/matter_examples/thermostat/mcux
    document:
      name: thermostat
      category: matter_examples
      brief: The NXP Thermostat example is based on Project CHIP and NXP SDK,
        and provides a prototype of a thermostat device which demonstrates device
        commissioning and different cluster control.
      example_readme:
        - examples/matter_examples/thermostat/README.md
    extra_files:
      - source: examples/matter_examples/thermostat/README.md
        destination: README.md
      - source: ${SdkRootDirPath}/middleware/matter/examples/thermostat/nxp/zap
        destination: zap
      - source: ${SdkRootDirPath}/middleware/matter/examples/thermostat/nxp/common
        destination: common
      - source: ${SdkRootDirPath}/middleware/matter/third_party/nxp/nxp_matter_support/examples/platform/rt/nxp_sdk_reconfig.cmake
        destination: nxp_sdk_reconfig.cmake
        board:
          [
            rdrw612bga,
            frdmrw612,
            evkbmimxrt1060,
            evkbmimxrt1170,
            evkcmimxrt1060,
          ]
      - source: ${SdkRootDirPath}/middleware/matter/third_party/nxp/nxp_matter_support/examples/platform/rt/rw61x/app/ldscripts/RW610_flash.ld
        destination: ldscripts/RW610_flash.ld
        board: [rdrw612bga, frdmrw612]
      - source: ${SdkRootDirPath}/middleware/matter/third_party/nxp/nxp_matter_support/examples/platform/rt/rt1170/app/ldscripts/MIMXRT1176xxxxx_cm7_flexspi_nor.ld
        destination: ldscripts/MIMXRT1176xxxxx_cm7_flexspi_nor.ld
        board: [evkbmimxrt1170]
      - source: ${SdkRootDirPath}/middleware/matter/third_party/nxp/nxp_matter_support/examples/platform/rt/rt1060/app/ldscripts/MIMXRT1062xxxxx_flexspi_nor.ld
        destination: ldscripts/MIMXRT1062xxxxx_flexspi_nor.ld
        board: [evkbmimxrt1060, evkcmimxrt1060]
    replacements:
      - file: CMakeLists.txt
        replace:
          - from: "get_filename_component(NXP_EXAMPLE_DIR ${CMAKE_CURRENT_SOURCE_DIR}/../common REALPATH)"
            to: "get_filename_component(NXP_EXAMPLE_DIR ${CMAKE_CURRENT_SOURCE_DIR}/common REALPATH)"
      - file: CMakeLists.txt
        replace:
          - from: "get_filename_component(NXP_EXAMPLE_ZAP_DIR ${CMAKE_CURRENT_SOURCE_DIR}/../zap REALPATH)"
            to: "get_filename_component(NXP_EXAMPLE_ZAP_DIR ${CMAKE_CURRENT_SOURCE_DIR}/zap REALPATH)"
      - file: CMakeLists.txt
        replace:
          - from: "get_filename_component(NXP_SDK_RECONFIG_CMAKE_DIR ${NXP_MATTER_SUPPORT_DIR}/examples/platform/${CONFIG_CHIP_NXP_PLATFORM_FAMILY} REALPATH)"
            to: "get_filename_component(NXP_SDK_RECONFIG_CMAKE_DIR ${CMAKE_CURRENT_SOURCE_DIR} REALPATH)"
      - file: nxp_sdk_reconfig.cmake
        replace:
          - from: "BASE_PATH ${MATTER_DEFAULT_LINKER_FILE_PATH}"
            to: "BASE_PATH ${CMAKE_CURRENT_SOURCE_DIR}"
        board:
          [
            rdrw612bga,
            frdmrw612,
            evkbmimxrt1170,
            evkbmimxrt1060,
            evkcmimxrt1060,
          ]
      - file: nxp_sdk_reconfig.cmake
        replace:
          - from: "LINKER ${MATTER_DEFAULT_LINKER_FILE_NAME}"
            to: "LINKER ldscripts/RW610_flash.ld"
        board: [rdrw612bga, frdmrw612]
      - file: nxp_sdk_reconfig.cmake
        replace:
          - from: "LINKER ${MATTER_DEFAULT_LINKER_FILE_NAME}"
            to: "LINKER ldscripts/MIMXRT1176xxxxx_cm7_flexspi_nor.ld"
        board: [evkbmimxrt1170]
      - file: nxp_sdk_reconfig.cmake
        replace:
          - from: "LINKER ${MATTER_DEFAULT_LINKER_FILE_NAME}"
            to: "LINKER ldscripts/MIMXRT1062xxxxx_flexspi_nor.ld"
        board: [evkbmimxrt1060, evkcmimxrt1060]
    freestanding_copied_folders:
      - middleware/matter/third_party/nxp/nxp_matter_support/examples/platform/project_segments
    toolchains:
      - +armgcc@debug
      - +armgcc@release
      - -armgcc@flash_debug
      - -armgcc@flash_release
      - -armgcc@flexspi_nor_debug
      - -armgcc@flexspi_nor_release
      - -armgcc@sdram_debug
      - -armgcc@sdram_release
      - -iar@debug
      - -iar@release
      - -iar@flash_debug
      - -iar@flash_release
      - -iar@flexspi_nor_debug
      - -iar@flexspi_nor_release
      - -iar@sdram_debug
      - -iar@sdram_release
      - -mdk@debug
      - -mdk@release
      - -mdk@flash_debug
      - -mdk@flash_release
      - -mdk@flexspi_nor_debug
      - -mdk@flexspi_nor_release
      - -mdk@sdram_debug
      - -mdk@sdram_release
  boards:
    evkbmimxrt1060: []
    evkbmimxrt1170@cm7: []
    evkcmimxrt1060: []
    frdmrw612: []
    rdrw612bga: []
